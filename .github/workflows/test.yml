name: Tests

# 每個 PR 同 main 有改動都自動跑：單元測試、Firestore 規則、NAS 匯出、瀏覽器（Firebase emulator，唔會掂真資料）
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            scripts/export/package-lock.json
      - uses: actions/setup-java@v4 # Firestore emulator 要 Java
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/package-lock.json') }}
      - run: npm ci
        working-directory: tests
      - run: npm ci --omit=dev
        working-directory: scripts/export
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Unit tests
        run: npm run unit
        working-directory: tests
      - name: Firestore rules, NAS export and browser tests (emulator)
        run: npm run emulated
        working-directory: tests
