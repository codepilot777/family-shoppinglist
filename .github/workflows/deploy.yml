name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 每次發佈都當新版本：app 會提示「有新版本，撳更新」
      - name: Stamp service worker version
        run: |
          sed -i -E "s/^const CACHE = '[^']*';/const CACHE = 'fsl-${GITHUB_SHA::8}';/" public/sw.js
          grep -n "^const CACHE" public/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
