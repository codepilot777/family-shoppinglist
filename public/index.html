<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>屋企購物清單</title>
  <meta name="description" content="屋企人一齊用嘅購物清單，即時同步 · Family shopping list · Daftar belanja keluarga">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="購物清單">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="loading">
    <p class="center muted">…</p>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // 萬一 app 載入失敗，唔好淨係見到「…」
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (!app || !app.classList.contains('loading') || app.querySelector('.card')) return;
      app.innerHTML = '<div class="card" style="max-width:420px"><h2>載入失敗 / Failed to load</h2><p class="small muted"></p>' +
        '<button class="btn primary block" onclick="location.reload()">再試 / Retry</button></div>';
      app.querySelector('p').textContent = (e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
    });
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
